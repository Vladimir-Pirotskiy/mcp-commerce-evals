[graph]
all-features = true

[advisories]
# CI fetches the default RustSec database (`cargo deny check advisories`). Offline, run only
# `cargo deny --offline check licenses bans sources`: those three need no database.
yanked = "warn"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
