name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tool-level-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --workspace
      - name: Start the reference store
        run: |
          ./target/release/reference-store &
          echo "STORE_PID=$!" >> "$GITHUB_ENV"
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/health
      - name: Run the tool-level eval
        run: ./target/release/mcp-commerce-evals --url http://127.0.0.1:8787/mcp
      - name: Stop the reference store
        if: always()
        run: kill "$STORE_PID"
