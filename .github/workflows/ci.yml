name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build the docs
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - run: cargo deny --locked check licenses bans sources

  tool-level-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release --workspace
      - name: Start the reference store
        run: |
          ./target/release/reference-store &
          echo "STORE_PID=$!" >> "$GITHUB_ENV"
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/health
      - name: Run the tool-level eval
        # The floors sit just under the committed results (hit@5 0.925, MRR 0.914), so a ranking
        # regression fails the job.
        run: |
          ./target/release/mcp-commerce-evals --url http://127.0.0.1:8787/mcp \
            --out eval-results.json --min-hit5 0.92 --min-mrr 0.91
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval-results.json
      - name: Stop the reference store
        if: always()
        run: kill "$STORE_PID"
